name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Frontend checks and build
        working-directory: web/ui
        run: |
          npm ci
          npm run lint
          npm run test:coverage
          npx playwright install --with-deps chromium
          npm run test:e2e

      - run: go build ./...
      - name: Go tests and core coverage gate
        run: |
          core_packages="$(go list ./bilibili ./notify ./service ./state ./web | paste -sd, -)"
          go test -covermode=atomic -coverpkg="${core_packages}" -coverprofile=coverage.out ./...
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "Core Go coverage: ${total}%"
          awk -v coverage="${total}" 'BEGIN { if (coverage + 0 < 80.0) exit 1 }'

      - name: Upload core Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: core-go
          use_oidc: true
          fail_ci_if_error: true

      - run: go test -race ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # GHA docker layer cache
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bili-notify:e2e
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=e2e
            COMMIT=${{ github.sha }}
            BUILD_DATE=unknown
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test production image
        run: ./e2e/docker-smoke.sh bili-notify:e2e

  docker:
    needs: [test, docker-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # GHA docker layer cache
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Compute build metadata
        id: meta_env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dengxinlin/bili-notify
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.meta_env.outputs.version }}
            COMMIT=${{ steps.meta_env.outputs.commit }}
            BUILD_DATE=${{ steps.meta_env.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
