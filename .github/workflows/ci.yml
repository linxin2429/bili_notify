name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, bili-notify-ci]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          # Self-hosted runners share a host GOMODCACHE; setup-go archive
          # restore collides with existing files and emits tar warnings.
          cache: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Build and test
        # Self-hosted runners already have Chromium system libs and cannot
        # passwordless sudo for playwright install-deps. Install browser only.
        run: make check

      - name: Upload core Go coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: core-go
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    needs: test
    runs-on: [self-hosted, macOS, ARM64, bili-notify-ci]
    permissions:
      contents: read
      actions: write # GHA docker layer cache
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build and smoke-test image
        env:
          DOCKER_BUILD: docker buildx build
          DOCKER_BUILD_FLAGS: --load --cache-from=type=gha --cache-to=type=gha,mode=max
          DOCKER_IMAGE: bili-notify:e2e
          GOPROXY: https://proxy.golang.org,direct
          VERSION: e2e
          COMMIT: ${{ github.sha }}
          BUILD_DATE: unknown
        run: make docker-smoke

  docker:
    needs: [test, docker-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, macOS, ARM64, bili-notify-ci]
    permissions:
      contents: read
      actions: write # GHA docker layer cache
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Compute build metadata
        id: meta_env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dengxinlin/bili-notify
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.meta_env.outputs.version }}
            COMMIT=${{ steps.meta_env.outputs.commit }}
            BUILD_DATE=${{ steps.meta_env.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
