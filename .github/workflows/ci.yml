name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      runs-on: ${{ steps.select.outputs.runs-on }}
      make-jobs: ${{ steps.select.outputs.make-jobs }}
      tool-workers: ${{ steps.select.outputs.tool-workers }}
    steps:
      - name: Prefer online self-hosted runners
        id: select
        env:
          GH_TOKEN: ${{ secrets.CI_RUNNER_STATUS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          kind=github-hosted
          runs_on='["ubuntu-latest"]'
          make_jobs=2
          tool_workers=2

          if [[ -n "${GH_TOKEN}" ]] && runners="$(gh api "repos/${GH_REPO}/actions/runners" 2>/dev/null)"; then
            if jq -e 'any(.runners[]; .status == "online" and any(.labels[]; .name == "bili-notify-primary"))' <<<"${runners}" >/dev/null; then
              kind=primary
              runs_on='["self-hosted","Linux","X64","bili-notify-primary"]'
              make_jobs=2
              tool_workers=8
            elif jq -e 'any(.runners[]; .status == "online" and any(.labels[]; .name == "bili-notify-ci"))' <<<"${runners}" >/dev/null; then
              kind=macmini
              runs_on='["self-hosted","macOS","ARM64","bili-notify-ci"]'
              make_jobs=2
              tool_workers=4
            fi
          fi

          echo "Selected ${kind} runner"
          echo "kind=${kind}" >> "${GITHUB_OUTPUT}"
          echo "runs-on=${runs_on}" >> "${GITHUB_OUTPUT}"
          echo "make-jobs=${make_jobs}" >> "${GITHUB_OUTPUT}"
          echo "tool-workers=${tool_workers}" >> "${GITHUB_OUTPUT}"

  test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          # Self-hosted runners retain their local Go caches. Restoring a
          # setup-go archive over those shared directories causes collisions.
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Self-hosted runners already retain ~/.npm. Uploading that shared
          # cache can exceed 1 GB and adds minutes to every first run.
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/ui/package-lock.json

      - name: Cache Playwright browsers
        if: needs.select-runner.outputs.kind == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/ui/package-lock.json') }}

      - name: Build and test
        # A fresh GitHub-hosted Linux VM also needs Chromium's system packages.
        # Both self-hosted machines already provide them.
        env:
          CI_MAKE_JOBS: ${{ needs.select-runner.outputs.make-jobs }}
          CI_TOOL_WORKERS: ${{ needs.select-runner.outputs.tool-workers }}
          GOMAXPROCS: ${{ needs.select-runner.outputs.tool-workers }}
          GOFLAGS: -p=${{ needs.select-runner.outputs.tool-workers }}
          GO_TEST_FLAGS: -parallel=${{ needs.select-runner.outputs.tool-workers }}
          PLAYWRIGHT_INSTALL_FLAGS: ${{ needs.select-runner.outputs.kind == 'github-hosted' && '--with-deps' || '' }}
        run: make -j"${CI_MAKE_JOBS}" ci-check

      - name: Install Codecov signature verifier
        if: runner.os == 'macOS'
        run: command -v gpg >/dev/null || brew install gnupg

      - name: Upload core Go coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: core-go
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  observability-config:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for attempt in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - name: Validate observability configuration and alert behavior
        run: make observability-validate

  image:
    name: Build, smoke-test, and publish image
    needs: [select-runner, test, observability-config]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      contents: read
      actions: write # GHA docker layer cache on Linux runners
    steps:
      - uses: actions/checkout@v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for attempt in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - uses: docker/setup-buildx-action@v4
        if: runner.os != 'macOS'

      - name: Compute build metadata
        id: build_env
        shell: bash
        run: |
          short_commit="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${short_commit}"
          else
            version="main-${short_commit}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "smoke_tag=bili-notify:smoke-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dengxinlin/bili-notify
          tags: |
            type=raw,value=${{ steps.build_env.outputs.version }},enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.build_env.outputs.smoke_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.build_env.outputs.version }}
            COMMIT=${{ steps.build_env.outputs.commit }}
            BUILD_DATE=${{ steps.build_env.outputs.build_date }}
          cache-from: ${{ runner.os != 'macOS' && 'type=gha,scope=bili-notify-linux-amd64' || '' }}
          cache-to: ${{ runner.os != 'macOS' && 'type=gha,mode=max,scope=bili-notify-linux-amd64' || '' }}
          provenance: false

      - name: Smoke-test image
        env:
          DOCKER_IMAGE: ${{ steps.build_env.outputs.smoke_tag }}
        run: make docker-smoke-image

      - name: Login to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push the tested image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SMOKE_TAG: ${{ steps.build_env.outputs.smoke_tag }}
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "${SMOKE_TAG}")"
          pushed_digest=""

          while IFS= read -r image_tag; do
            [[ -n "${image_tag}" ]] || continue
            docker tag "${image_id}" "${image_tag}"
            push_output="$(docker push "${image_tag}")"
            printf '%s\n' "${push_output}"

            digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' <<<"${push_output}" | tail -1)"
            [[ -n "${digest}" ]]
            if [[ -n "${pushed_digest}" && "${digest}" != "${pushed_digest}" ]]; then
              echo "pushed tags do not reference one image: ${pushed_digest} != ${digest}" >&2
              exit 1
            fi
            pushed_digest="${digest}"
          done <<<"${IMAGE_TAGS}"

          [[ -n "${pushed_digest}" ]]
          {
            echo '### Published Docker image'
            echo
            echo "Digest: \`${pushed_digest}\`"
            echo
            echo 'Tags:'
            while IFS= read -r image_tag; do
              [[ -n "${image_tag}" ]] && echo "- \`${image_tag}\`"
            done <<<"${IMAGE_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"
