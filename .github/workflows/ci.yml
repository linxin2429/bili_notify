name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Prefer an online, idle self-hosted Linux/X64 runner when one is visible.
  # Resolution order:
  #   1. vars.CI_RUNS_ON — JSON array override, e.g. ["self-hosted","Linux","X64"] or ["ubuntu-latest"]
  #   2. List repository runners via secrets.RUNNER_QUERY_TOKEN (optional admin:read PAT) or GITHUB_TOKEN
  #   3. Fall back to ubuntu-latest
  choose-runner:
    runs-on: ubuntu-latest
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
    steps:
      - id: pick
        env:
          # Optional PAT with repo Administration: Read can list runners when GITHUB_TOKEN cannot.
          GH_TOKEN: ${{ secrets.RUNNER_QUERY_TOKEN || github.token }}
          CI_RUNS_ON: ${{ vars.CI_RUNS_ON }}
        run: |
          set -euo pipefail

          if [ -n "${CI_RUNS_ON:-}" ]; then
            if ! printf '%s' "$CI_RUNS_ON" | jq -e 'type == "array" and length > 0 and all(type == "string")' >/dev/null; then
              echo "vars.CI_RUNS_ON must be a non-empty JSON string array, got: ${CI_RUNS_ON}" >&2
              exit 1
            fi
            echo "runs_on=${CI_RUNS_ON}" >> "$GITHUB_OUTPUT"
            echo "Selected runs-on=${CI_RUNS_ON} (vars.CI_RUNS_ON override)"
            exit 0
          fi

          runs_on='["ubuntu-latest"]'
          reason='no online idle self-hosted Linux/X64 runner'
          if json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runners" 2>/dev/null)"; then
            count="$(printf '%s' "$json" | jq '[.runners[]?
              | select(.status == "online" and .busy == false)
              | select([.labels[].name] | index("self-hosted") != null)
              | select([.labels[].name] | index("Linux") != null)
              | select([.labels[].name] | (index("X64") != null or index("x64") != null))
            ] | length')"
            if [ "${count:-0}" -gt 0 ]; then
              runs_on='["self-hosted","Linux","X64"]'
              reason="online idle self-hosted Linux/X64 runners: ${count}"
            fi
          else
            reason='unable to list repository runners; set vars.CI_RUNS_ON or secrets.RUNNER_QUERY_TOKEN to prefer self-hosted'
          fi

          echo "runs_on=${runs_on}" >> "$GITHUB_OUTPUT"
          echo "Selected runs-on=${runs_on} (${reason})"

  test:
    needs: choose-runner
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Build and test
        run: make check PLAYWRIGHT_INSTALL_FLAGS=--with-deps

      - name: Upload core Go coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: core-go
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    needs: [choose-runner, test]
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    permissions:
      contents: read
      actions: write # GHA docker layer cache
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build and smoke-test image
        env:
          DOCKER_BUILD: docker buildx build
          DOCKER_BUILD_FLAGS: --load --cache-from=type=gha --cache-to=type=gha,mode=max
          DOCKER_IMAGE: bili-notify:e2e
          GOPROXY: https://proxy.golang.org,direct
          VERSION: e2e
          COMMIT: ${{ github.sha }}
          BUILD_DATE: unknown
        run: make docker-smoke

  docker:
    needs: [choose-runner, test, docker-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(needs.choose-runner.outputs.runs_on) }}
    permissions:
      contents: read
      actions: write # GHA docker layer cache
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Compute build metadata
        id: meta_env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dengxinlin/bili-notify
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.meta_env.outputs.version }}
            COMMIT=${{ steps.meta_env.outputs.commit }}
            BUILD_DATE=${{ steps.meta_env.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
