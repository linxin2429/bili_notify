name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      runs-on: ${{ steps.select.outputs.runs-on }}
      make-jobs: ${{ steps.select.outputs.make-jobs }}
      tool-workers: ${{ steps.select.outputs.tool-workers }}
    steps:
      - name: Prefer online self-hosted runners
        id: select
        env:
          GH_TOKEN: ${{ secrets.CI_RUNNER_STATUS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          kind=github-hosted
          runs_on='["ubuntu-latest"]'
          make_jobs=2
          tool_workers=2

          if [[ -n "${GH_TOKEN}" ]] && runners="$(gh api "repos/${GH_REPO}/actions/runners" 2>/dev/null)"; then
            if jq -e 'any(.runners[]; .status == "online" and any(.labels[]; .name == "bili-notify-primary"))' <<<"${runners}" >/dev/null; then
              kind=primary
              runs_on='["self-hosted","Linux","X64","bili-notify-primary"]'
              make_jobs=2
              tool_workers=8
            elif jq -e 'any(.runners[]; .status == "online" and any(.labels[]; .name == "bili-notify-ci"))' <<<"${runners}" >/dev/null; then
              kind=macmini
              runs_on='["self-hosted","macOS","ARM64","bili-notify-ci"]'
              make_jobs=2
              tool_workers=4
            fi
          fi

          echo "Selected ${kind} runner"
          echo "kind=${kind}" >> "${GITHUB_OUTPUT}"
          echo "runs-on=${runs_on}" >> "${GITHUB_OUTPUT}"
          echo "make-jobs=${make_jobs}" >> "${GITHUB_OUTPUT}"
          echo "tool-workers=${tool_workers}" >> "${GITHUB_OUTPUT}"

  test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Self-hosted runners retain their local Go caches. Restoring a
          # setup-go archive over those shared directories causes collisions.
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          # Self-hosted runners already retain ~/.npm. Uploading that shared
          # cache can exceed 1 GB and adds minutes to every first run.
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/ui/package-lock.json

      - name: Cache Playwright browsers
        if: needs.select-runner.outputs.kind == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/ui/package-lock.json') }}

      - name: Build and test
        # A fresh GitHub-hosted Linux VM also needs Chromium's system packages.
        # Both self-hosted machines already provide them.
        env:
          CI_MAKE_JOBS: ${{ needs.select-runner.outputs.make-jobs }}
          CI_TOOL_WORKERS: ${{ needs.select-runner.outputs.tool-workers }}
          GOMAXPROCS: ${{ needs.select-runner.outputs.tool-workers }}
          GOFLAGS: -p=${{ needs.select-runner.outputs.tool-workers }}
          GO_TEST_FLAGS: -parallel=${{ needs.select-runner.outputs.tool-workers }}
          PLAYWRIGHT_INSTALL_FLAGS: ${{ needs.select-runner.outputs.kind == 'github-hosted' && '--with-deps' || '' }}
        run: make -j"${CI_MAKE_JOBS}" ci-check

      - name: Upload core Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-go-coverage-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  codecov:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download core Go coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: core-go-coverage-${{ github.run_attempt }}

      - name: Upload core Go coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
          flags: core-go
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_pr: ${{ github.event.pull_request.number || '' }}
          override_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}

  codecov-policy:
    name: Enforce Codecov patch coverage
    needs: codecov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Wait for the Codecov patch result
        shell: bash
        run: |
          for attempt in {1..120}; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REPORT_SHA}/status" \
              --jq '[.statuses[] | select(.context == "codecov/patch")][0].state // "missing"')"
            case "${state}" in
              success) exit 0 ;;
              failure|error) exit 1 ;;
              pending|missing) sleep 5 ;;
              *) echo "unexpected Codecov patch state: ${state}" >&2; exit 1 ;;
            esac
          done
          echo 'Codecov did not report patch coverage within 10 minutes' >&2
          exit 1

  observability-config:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for attempt in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - name: Validate observability configuration and alert behavior
        run: make observability-validate

  image:
    name: Build and smoke-test image
    needs: [select-runner, test, observability-config]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for attempt in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: runner.os != 'macOS'

      - name: Compute build metadata
        id: build_env
        shell: bash
        run: |
          short_commit="${GITHUB_SHA:0:12}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            version="pr-${{ github.event.pull_request.number }}-${short_commit}"
          else
            version="main-${short_commit}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
          echo "smoke_tag=bili-notify:smoke-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.build_env.outputs.smoke_tag }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.build_env.outputs.version }}
            COMMIT=${{ steps.build_env.outputs.commit }}
            BUILD_DATE=${{ steps.build_env.outputs.build_date }}
          cache-from: ${{ runner.os != 'macOS' && 'type=gha,scope=bili-notify-linux-amd64' || '' }}
          cache-to: ${{ runner.os != 'macOS' && 'type=gha,mode=min,scope=bili-notify-linux-amd64,ignore-error=true' || '' }}
          provenance: false

      - name: Smoke-test image
        env:
          DOCKER_IMAGE: ${{ steps.build_env.outputs.smoke_tag }}
        run: make docker-smoke-image

  ci-gate:
    name: CI Gate
    if: always()
    needs: [test, codecov, codecov-policy, observability-config, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      TEST_RESULT: ${{ needs.test.result }}
      CODECOV_RESULT: ${{ needs.codecov.result }}
      CODECOV_POLICY_RESULT: ${{ needs.codecov-policy.result }}
      OBSERVABILITY_RESULT: ${{ needs.observability-config.result }}
      IMAGE_RESULT: ${{ needs.image.result }}
    steps:
      - name: Require every CI gate
        shell: bash
        run: |
          for result in \
            "${TEST_RESULT}" \
            "${CODECOV_RESULT}" \
            "${CODECOV_POLICY_RESULT}" \
            "${OBSERVABILITY_RESULT}" \
            "${IMAGE_RESULT}"; do
            [[ "${result}" == "success" ]] || exit 1
          done
