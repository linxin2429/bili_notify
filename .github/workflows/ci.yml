name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-runner:
    name: Select CI runner
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      runs-on: ${{ steps.select.outputs.runs-on }}
    steps:
      - name: Prefer online self-hosted runners
        id: select
        env:
          GH_TOKEN: ${{ secrets.CI_RUNNER_STATUS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          kind=github-hosted
          runs_on='["ubuntu-latest"]'

          if [[ -n "${GH_TOKEN}" ]] && runners="$(gh api "repos/${GH_REPO}/actions/runners" 2>/dev/null)"; then
            if jq -e 'any(.runners[]; .status == "online" and any(.labels[]; .name == "bili-notify-primary"))' <<<"${runners}" >/dev/null; then
              kind=primary
              runs_on='["self-hosted","Linux","X64","bili-notify-primary"]'
            elif jq -e 'any(.runners[]; .status == "online" and any(.labels[]; .name == "bili-notify-ci"))' <<<"${runners}" >/dev/null; then
              kind=macmini
              runs_on='["self-hosted","macOS","ARM64","bili-notify-ci"]'
            fi
          fi

          echo "Selected ${kind} runner"
          echo "kind=${kind}" >> "${GITHUB_OUTPUT}"
          echo "runs-on=${runs_on}" >> "${GITHUB_OUTPUT}"

  test:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          # Self-hosted runners retain their local Go caches. Restoring a
          # setup-go archive over those shared directories causes collisions.
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Self-hosted runners already retain ~/.npm. Uploading that shared
          # cache can exceed 1 GB and adds minutes to every first run.
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/ui/package-lock.json

      - name: Cache Playwright browsers
        if: needs.select-runner.outputs.kind == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/ui/package-lock.json') }}

      - name: Build and test
        # A fresh GitHub-hosted Linux VM also needs Chromium's system packages.
        # Both self-hosted machines already provide them.
        env:
          PLAYWRIGHT_INSTALL_FLAGS: ${{ needs.select-runner.outputs.kind == 'github-hosted' && '--with-deps' || '' }}
        run: make check

      - name: Install Codecov signature verifier
        if: runner.os == 'macOS'
        run: command -v gpg >/dev/null || brew install gnupg

      - name: Upload core Go coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          flags: core-go
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker-smoke:
    needs: [select-runner, test]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      contents: read
      actions: write # GHA docker layer cache on Linux runners
    steps:
      - uses: actions/checkout@v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for attempt in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - uses: docker/setup-buildx-action@v4
        if: runner.os != 'macOS'

      - name: Build and smoke-test image
        env:
          DOCKER_BUILD: docker buildx build
          DOCKER_BUILD_FLAGS: ${{ runner.os == 'macOS' && '--load' || '--load --cache-from=type=gha --cache-to=type=gha,mode=max' }}
          DOCKER_IMAGE: bili-notify:e2e
          GOPROXY: https://proxy.golang.org,direct
          VERSION: e2e
          COMMIT: ${{ github.sha }}
          BUILD_DATE: unknown
        run: make docker-smoke

  docker:
    needs: [select-runner, test, docker-smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for attempt in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - name: Compute build metadata
        id: meta_env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: dengxinlin/bili-notify
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.meta_env.outputs.version }}
            COMMIT=${{ steps.meta_env.outputs.commit }}
            BUILD_DATE=${{ steps.meta_env.outputs.build_date }}
