name: Release component

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      force:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  plan:
    name: Validate source and detect component changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sha: ${{ steps.plan.outputs.sha }}
      component: ${{ steps.plan.outputs.component }}
    steps:
      - name: Validate requested tag syntax
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^(app|worker)/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
            [[ "${WORKFLOW_REF}" == "refs/tags/${RELEASE_TAG}" ]]
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Require a release source from main before running repository code
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" refs/remotes/origin/main

      - name: Plan release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          force_args=()
          if [[ "${FORCE}" == true ]]; then force_args+=(--force); fi
          python3 .github/release/release.py plan --tag "${RELEASE_TAG}" "${force_args[@]}" --file "${RUNNER_TEMP}/release-plan.json"

  select-runner:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    name: Select release runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      runs-on: ${{ steps.select.outputs.runs-on }}
      make-jobs: ${{ steps.select.outputs.make-jobs }}
      tool-workers: ${{ steps.select.outputs.tool-workers }}
    steps:
      - name: Prefer online self-hosted runners
        id: select
        env:
          GH_TOKEN: ${{ secrets.CI_RUNNER_STATUS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          kind=github-hosted
          runs_on='["ubuntu-latest"]'
          make_jobs=2
          tool_workers=2

          if [[ -n "${GH_TOKEN}" ]] && runners="$(gh api "repos/${GH_REPO}/actions/runners" 2>/dev/null)"; then
            if jq -e 'any(.runners[]; .status == "online" and (.busy | not) and any(.labels[]; .name == "bili-notify-primary"))' <<<"${runners}" >/dev/null; then
              kind=primary
              runs_on='["self-hosted","Linux","X64","bili-notify-primary"]'
              make_jobs=2
              tool_workers=8
            elif jq -e 'any(.runners[]; .status == "online" and (.busy | not) and any(.labels[]; .name == "bili-notify-ci"))' <<<"${runners}" >/dev/null; then
              kind=macmini
              runs_on='["self-hosted","macOS","ARM64","bili-notify-ci"]'
              make_jobs=2
              tool_workers=4
            fi
          fi

          echo "Selected ${kind} runner"
          {
            echo "kind=${kind}"
            echo "runs-on=${runs_on}"
            echo "make-jobs=${make_jobs}"
            echo "tool-workers=${tool_workers}"
          } >> "${GITHUB_OUTPUT}"

  test:
    needs: [plan, select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/ui/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            worker/requirements.lock
            worker/requirements-dev.lock

      - name: Cache Playwright browsers
        if: needs.select-runner.outputs.kind == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/ui/package-lock.json') }}

      - name: Revalidate release source
        env:
          CI_MAKE_JOBS: ${{ needs.select-runner.outputs.make-jobs }}
          CI_TOOL_WORKERS: ${{ needs.select-runner.outputs.tool-workers }}
          GOMAXPROCS: ${{ needs.select-runner.outputs.tool-workers }}
          GOFLAGS: -p=${{ needs.select-runner.outputs.tool-workers }}
          GO_TEST_FLAGS: -parallel=${{ needs.select-runner.outputs.tool-workers }}
          PLAYWRIGHT_INSTALL_FLAGS: ${{ needs.select-runner.outputs.kind == 'github-hosted' && '--with-deps' || '' }}
        run: make -j"${CI_MAKE_JOBS}" ci-check

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ needs.plan.outputs.component }}-playwright-results-${{ github.run_attempt }}
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  observability-config:
    needs: [plan, select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for _ in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - name: Validate observability configuration and alert behavior
        run: make observability-validate

  release:
    name: Publish verified component image
    needs: [plan, select-runner, test, observability-config]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 40
    environment: dockerhub-production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      COMPONENT: ${{ needs.plan.outputs.component }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Recheck tag and successful baseline after approval
        id: plan
        env:
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          force_args=()
          if [[ "${FORCE}" == true ]]; then force_args+=(--force); fi
          plan_file="${RUNNER_TEMP}/release-${COMPONENT}-${GITHUB_RUN_ID}.json"
          python3 .github/release/release.py plan --tag "${RELEASE_TAG}" "${force_args[@]}" --file "${plan_file}"
          {
            echo "PLAN_FILE=${plan_file}"
            echo "SMOKE_TAG=bili-notify-${COMPONENT}:release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "${GITHUB_ENV}"

      - name: Start Docker Desktop
        if: steps.plan.outputs.publish == 'true' && runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for _ in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - name: Prepare isolated Docker credentials
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        run: |
          original_config="${DOCKER_CONFIG:-${HOME}/.docker}"
          current_context="$(docker context show)"
          docker_config="${RUNNER_TEMP}/bili-notify-docker-${COMPONENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${docker_config}"
          chmod 700 "${docker_config}"
          # Preserve Docker Desktop's endpoint and CLI plugin discovery while
          # keeping credentials separate from the runner's interactive config.
          for directory in contexts cli-plugins; do
            if [[ -d "${original_config}/${directory}" ]]; then
              ln -s "${original_config}/${directory}" "${docker_config}/${directory}"
            fi
          done
          jq -n --arg context "${current_context}" '{currentContext: $context, auths: {"https://index.docker.io/v1/": {}}}' > "${docker_config}/config.json"
          chmod 600 "${docker_config}/config.json"
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Login to Docker Hub
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to move image aliases to an older version
        if: steps.plan.outputs.publish == 'true'
        run: python3 .github/release/registry.py guard --file "${PLAN_FILE}" --smoke-tag "${SMOKE_TAG}" --repo "${GITHUB_REPOSITORY}"

      - name: Recover an existing matching immutable version
        if: steps.plan.outputs.publish == 'true'
        id: recover
        run: python3 .github/release/registry.py recover --file "${PLAN_FILE}" --smoke-tag "${SMOKE_TAG}" --repo "${GITHUB_REPOSITORY}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: steps.plan.outputs.publish == 'true' && steps.recover.outputs.recovered != 'true' && runner.os != 'macOS'

      - name: Build component release image
        if: steps.plan.outputs.publish == 'true' && steps.recover.outputs.recovered != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ steps.plan.outputs.dockerfile }}
          load: true
          push: false
          no-cache: true
          platforms: linux/amd64
          tags: ${{ env.SMOKE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.plan.outputs.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            io.bili-notify.release.component=${{ steps.plan.outputs.component }}
            io.bili-notify.release.inputs=${{ steps.plan.outputs.input_hash }}
            io.bili-notify.release.tag=${{ inputs.tag }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.plan.outputs.version }}
            COMMIT=${{ steps.plan.outputs.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          provenance: false

      - name: Smoke-test the exact image to publish (including recovered images)
        if: steps.plan.outputs.publish == 'true'
        env:
          SMOKE_TARGET: ${{ steps.plan.outputs.smoke_target }}
        run: make "${SMOKE_TARGET}" DOCKER_IMAGE="${SMOKE_TAG}" AI_WORKER_IMAGE="${SMOKE_TAG}"

      - name: Publish immutable version
        if: steps.plan.outputs.publish == 'true'
        id: publish
        run: python3 .github/release/registry.py immutable --file "${PLAN_FILE}" --smoke-tag "${SMOKE_TAG}" --repo "${GITHUB_REPOSITORY}"

      - name: Generate SPDX SBOM
        if: steps.plan.outputs.publish == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.SMOKE_TAG }}
          format: spdx-json
          output-file: ${{ runner.temp }}/release-${{ env.COMPONENT }}-sbom.spdx.json
          artifact-name: ${{ env.COMPONENT }}-${{ steps.plan.outputs.version }}-sbom-${{ github.run_attempt }}
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Install Cosign
        if: steps.plan.outputs.publish == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Sign image and attach SBOM
        if: steps.plan.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "index.docker.io/${IMAGE_NAME}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate "${RUNNER_TEMP}/release-${COMPONENT}-sbom.spdx.json" "index.docker.io/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        if: steps.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: index.docker.io/${{ steps.plan.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}

      - name: Publish mutable aliases after verification
        if: steps.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: python3 .github/release/registry.py aliases --file "${PLAN_FILE}" --smoke-tag "${SMOKE_TAG}" --repo "${GITHUB_REPOSITORY}" --digest "${DIGEST}"

      - name: Record successful component release
        if: steps.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: python3 .github/release/release.py complete --file "${PLAN_FILE}" --digest "${DIGEST}"

      - name: Remove isolated Docker credentials
        if: always()
        shell: bash
        run: |
          docker_config="${RUNNER_TEMP}/bili-notify-docker-${COMPONENT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -d "${docker_config}" ]]; then
            DOCKER_CONFIG="${docker_config}" docker logout docker.io >/dev/null 2>&1 || true
            # Buildx and login actions still have post-job cleanup to run. Leave
            # their temporary context intact, but remove credentials even if
            # logout failed; RUNNER_TEMP is cleaned by the runner afterwards.
            jq '.auths = {}' "${docker_config}/config.json" > "${docker_config}/clean.json"
            chmod 600 "${docker_config}/clean.json"
            mv "${docker_config}/clean.json" "${docker_config}/config.json"
          fi
