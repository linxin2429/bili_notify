name: Release

on:
  push:
    tags: ['app/v*', 'worker/v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing component tag (app/vX.Y.Z or worker/vX.Y.Z); select the same tag as the workflow ref'
        required: true
        type: string
      force:
        description: 'Publish a new version even when component inputs are unchanged'
        default: false
        type: boolean

# Serialize planning through recording success, independently for each component.
# GitHub retains one pending run per group; a superseded tag can be rerun manually.
concurrency:
  group: release-${{ startsWith(inputs.tag || github.ref_name, 'worker/') && 'worker' || 'app' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  component:
    uses: ./.github/workflows/release-component.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      force: ${{ inputs.force || false }}
