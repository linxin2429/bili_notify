name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require a stable SemVer tag from main
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main

  select-runner:
    name: Select release runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      runs-on: ${{ steps.select.outputs.runs-on }}
      make-jobs: ${{ steps.select.outputs.make-jobs }}
      tool-workers: ${{ steps.select.outputs.tool-workers }}
    steps:
      - name: Prefer online self-hosted runners
        id: select
        env:
          GH_TOKEN: ${{ secrets.CI_RUNNER_STATUS_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          kind=github-hosted
          runs_on='["ubuntu-latest"]'
          make_jobs=2
          tool_workers=2

          if [[ -n "${GH_TOKEN}" ]] && runners="$(gh api "repos/${GH_REPO}/actions/runners" 2>/dev/null)"; then
            if jq -e 'any(.runners[]; .status == "online" and (.busy | not) and any(.labels[]; .name == "bili-notify-primary"))' <<<"${runners}" >/dev/null; then
              kind=primary
              runs_on='["self-hosted","Linux","X64","bili-notify-primary"]'
              make_jobs=2
              tool_workers=8
            elif jq -e 'any(.runners[]; .status == "online" and (.busy | not) and any(.labels[]; .name == "bili-notify-ci"))' <<<"${runners}" >/dev/null; then
              kind=macmini
              runs_on='["self-hosted","macOS","ARM64","bili-notify-ci"]'
              make_jobs=2
              tool_workers=4
            fi
          fi

          echo "Selected ${kind} runner"
          {
            echo "kind=${kind}"
            echo "runs-on=${runs_on}"
            echo "make-jobs=${make_jobs}"
            echo "tool-workers=${tool_workers}"
          } >> "${GITHUB_OUTPUT}"

  test:
    needs: [validate-tag, select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: web/ui/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: ${{ needs.select-runner.outputs.kind == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            worker/requirements.lock
            worker/requirements-dev.lock

      - name: Cache Playwright browsers
        if: needs.select-runner.outputs.kind == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/ui/package-lock.json') }}

      - name: Revalidate release source
        env:
          CI_MAKE_JOBS: ${{ needs.select-runner.outputs.make-jobs }}
          CI_TOOL_WORKERS: ${{ needs.select-runner.outputs.tool-workers }}
          GOMAXPROCS: ${{ needs.select-runner.outputs.tool-workers }}
          GOFLAGS: -p=${{ needs.select-runner.outputs.tool-workers }}
          GO_TEST_FLAGS: -parallel=${{ needs.select-runner.outputs.tool-workers }}
          PLAYWRIGHT_INSTALL_FLAGS: ${{ needs.select-runner.outputs.kind == 'github-hosted' && '--with-deps' || '' }}
        run: make -j"${CI_MAKE_JOBS}" ci-check

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-playwright-results-${{ github.run_attempt }}
          path: |
            web/ui/test-results
            web/ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  observability-config:
    needs: [validate-tag, select-runner]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for _ in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - name: Validate observability configuration and alert behavior
        run: make observability-validate

  release:
    name: Publish verified images
    needs: [validate-tag, select-runner, test, observability-config]
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runs-on) }}
    timeout-minutes: 40
    environment: dockerhub-production
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: dengxinlin/bili-notify
      QUALIFIED_IMAGE_NAME: index.docker.io/dengxinlin/bili-notify
      AI_WORKER_IMAGE_NAME: dengxinlin/bili-notify-ai-worker
      QUALIFIED_AI_WORKER_IMAGE_NAME: index.docker.io/dengxinlin/bili-notify-ai-worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start Docker Desktop
        if: runner.os == 'macOS'
        run: |
          if ! docker info >/dev/null 2>&1; then
            open -gj -a Docker
          fi
          for _ in {1..60}; do
            if docker info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Docker Desktop did not become ready within 120 seconds" >&2
          exit 1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: runner.os != 'macOS'

      - name: Compute release metadata
        id: build_env
        shell: bash
        run: |
          {
            echo "version=${GITHUB_REF_NAME#v}"
            echo "commit=${GITHUB_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "smoke_tag=bili-notify:release-${GITHUB_SHA}"
            echo "worker_smoke_tag=bili-notify-ai-worker:release-${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compute image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Compute AI Worker image tags and labels
        id: worker_metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.AI_WORKER_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          no-cache: true
          platforms: linux/amd64
          tags: ${{ steps.build_env.outputs.smoke_tag }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            VERSION=${{ steps.build_env.outputs.version }}
            COMMIT=${{ steps.build_env.outputs.commit }}
            BUILD_DATE=${{ steps.build_env.outputs.build_date }}
          provenance: false

      - name: Smoke-test release image
        env:
          DOCKER_IMAGE: ${{ steps.build_env.outputs.smoke_tag }}
        run: make docker-smoke-image

      - name: Build AI Worker release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: worker/Dockerfile
          load: true
          push: false
          no-cache: true
          platforms: linux/amd64
          tags: ${{ steps.build_env.outputs.worker_smoke_tag }}
          labels: ${{ steps.worker_metadata.outputs.labels }}
          provenance: false

      - name: Smoke-test AI Worker release image
        env:
          AI_WORKER_IMAGE: ${{ steps.build_env.outputs.worker_smoke_tag }}
        run: make worker-docker-smoke-image

      - name: Prepare isolated Docker credentials
        shell: bash
        run: |
          docker_config="${RUNNER_TEMP}/bili-notify-docker-config"
          mkdir -p "${docker_config}"
          chmod 700 "${docker_config}"
          # An auths entry makes Docker use this file instead of auto-detecting
          # the macOS Keychain helper, which cannot prompt on a headless runner.
          printf '{"auths":{"https://index.docker.io/v1/":{}}}\n' > "${docker_config}/config.json"
          chmod 600 "${docker_config}/config.json"
          echo "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite immutable versions
        env:
          VERSION: ${{ steps.build_env.outputs.version }}
        shell: bash
        run: |
          if docker manifest inspect "${IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE_NAME}:${VERSION} already exists and cannot be overwritten" >&2
            exit 1
          fi
          if docker manifest inspect "${AI_WORKER_IMAGE_NAME}:${VERSION}" >/dev/null 2>&1; then
            echo "${AI_WORKER_IMAGE_NAME}:${VERSION} already exists and cannot be overwritten" >&2
            exit 1
          fi

      - name: Tag and push the tested application image
        id: publish_app
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          SMOKE_TAG: ${{ steps.build_env.outputs.smoke_tag }}
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "${SMOKE_TAG}")"
          pushed_digest=""

          while IFS= read -r image_tag; do
            [[ -n "${image_tag}" ]] || continue
            docker tag "${image_id}" "${image_tag}"
            push_output="$(docker push "${image_tag}")"
            printf '%s\n' "${push_output}"

            digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' <<<"${push_output}" | tail -1)"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ -n "${pushed_digest}" && "${digest}" != "${pushed_digest}" ]]; then
              echo "pushed tags do not reference one image: ${pushed_digest} != ${digest}" >&2
              exit 1
            fi
            pushed_digest="${digest}"
          done <<<"${IMAGE_TAGS}"

          [[ -n "${pushed_digest}" ]]
          echo "digest=${pushed_digest}" >> "${GITHUB_OUTPUT}"

      - name: Tag and push the tested AI Worker image
        id: publish_worker
        env:
          IMAGE_TAGS: ${{ steps.worker_metadata.outputs.tags }}
          SMOKE_TAG: ${{ steps.build_env.outputs.worker_smoke_tag }}
        shell: bash
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "${SMOKE_TAG}")"
          pushed_digest=""

          while IFS= read -r image_tag; do
            [[ -n "${image_tag}" ]] || continue
            docker tag "${image_id}" "${image_tag}"
            push_output="$(docker push "${image_tag}")"
            printf '%s\n' "${push_output}"

            digest="$(sed -n 's/^.*digest: \(sha256:[0-9a-f]*\).*$/\1/p' <<<"${push_output}" | tail -1)"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ -n "${pushed_digest}" && "${digest}" != "${pushed_digest}" ]]; then
              echo "pushed tags do not reference one image: ${pushed_digest} != ${digest}" >&2
              exit 1
            fi
            pushed_digest="${digest}"
          done <<<"${IMAGE_TAGS}"

          [[ -n "${pushed_digest}" ]]
          echo "digest=${pushed_digest}" >> "${GITHUB_OUTPUT}"

      - name: Generate application SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.build_env.outputs.smoke_tag }}
          format: spdx-json
          output-file: application-sbom.spdx.json
          artifact-name: bili-notify-${{ steps.build_env.outputs.version }}-sbom.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Generate AI Worker SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.build_env.outputs.worker_smoke_tag }}
          format: spdx-json
          output-file: worker-sbom.spdx.json
          artifact-name: bili-notify-ai-worker-${{ steps.build_env.outputs.version }}-sbom.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: Sign images and attach SBOMs
        env:
          APPLICATION_DIGEST: ${{ steps.publish_app.outputs.digest }}
          WORKER_DIGEST: ${{ steps.publish_worker.outputs.digest }}
        shell: bash
        run: |
          cosign sign --yes "${QUALIFIED_IMAGE_NAME}@${APPLICATION_DIGEST}"
          cosign attest --yes --type spdxjson --predicate application-sbom.spdx.json "${QUALIFIED_IMAGE_NAME}@${APPLICATION_DIGEST}"
          cosign sign --yes "${QUALIFIED_AI_WORKER_IMAGE_NAME}@${WORKER_DIGEST}"
          cosign attest --yes --type spdxjson --predicate worker-sbom.spdx.json "${QUALIFIED_AI_WORKER_IMAGE_NAME}@${WORKER_DIGEST}"

      - name: Attest application build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.QUALIFIED_IMAGE_NAME }}
          subject-digest: ${{ steps.publish_app.outputs.digest }}

      - name: Attest AI Worker build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.QUALIFIED_AI_WORKER_IMAGE_NAME }}
          subject-digest: ${{ steps.publish_worker.outputs.digest }}

      - name: Summarize release
        env:
          APPLICATION_DIGEST: ${{ steps.publish_app.outputs.digest }}
          APPLICATION_TAGS: ${{ steps.metadata.outputs.tags }}
          WORKER_DIGEST: ${{ steps.publish_worker.outputs.digest }}
          WORKER_TAGS: ${{ steps.worker_metadata.outputs.tags }}
        shell: bash
        run: |
          {
            echo '### Published Docker images'
            echo
            echo '#### Application'
            echo
            echo "Digest: \`${APPLICATION_DIGEST}\`"
            echo
            echo 'Tags:'
            while IFS= read -r image_tag; do
              [[ -n "${image_tag}" ]] && echo "- \`${image_tag}\`"
            done <<<"${APPLICATION_TAGS}"
            echo
            echo '#### AI Worker'
            echo
            echo "Digest: \`${WORKER_DIGEST}\`"
            echo
            echo 'Tags:'
            while IFS= read -r image_tag; do
              [[ -n "${image_tag}" ]] && echo "- \`${image_tag}\`"
            done <<<"${WORKER_TAGS}"
            echo
            echo 'Both digests are signed and have SPDX SBOM and build-provenance attestations.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove isolated Docker credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/bili-notify-docker-config
        shell: bash
        run: docker logout docker.io >/dev/null 2>&1 || true
