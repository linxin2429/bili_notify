name: Stability

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      repeat_count:
        description: Number of times to repeat every Go test
        required: true
        default: '10'

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-stability:
    name: Repeated shuffled race tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Repeat shuffled race tests
        env:
          GO_STABILITY_COUNT: ${{ github.event.inputs.repeat_count || '10' }}
        run: make test-stability
