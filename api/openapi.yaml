openapi: 3.1.0
info:
  title: bili-notify administration API
  version: 3.0.0
  description: |
    Authoritative transport contract for the same-origin TLS administration UI.
    Version 3 unifies Bilibili and Knowledge Planet accounts, sources, content and comment trees.
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: session
  - name: runtime
  - name: channels
  - name: deliveries
  - name: login
  - name: history
  - name: audit
  - name: ai
  - name: accounts
  - name: sources
paths:
  /api/v4/session:
    get:
      tags: [session]
      security: []
      operationId: getSession
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [session]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/CSRFResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [session]
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Session deleted.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
  /api/v4/setup:
    post:
      tags: [session]
      security: []
      operationId: setupAdministrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          $ref: '#/components/responses/CSRFResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/session/password:
    put:
      tags: [session]
      operationId: changePassword
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/CSRFResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/runtime:
    get:
      tags: [runtime]
      operationId: getRuntime
      responses:
        '200':
          description: Current server-owned runtime state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Runtime'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/settings:
    get:
      tags: [runtime]
      operationId: getSettings
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
    put:
      tags: [runtime]
      operationId: updateSettings
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSettings'
      responses:
        '200':
          $ref: '#/components/responses/SettingsResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/channels:
    get:
      tags: [channels]
      operationId: listChannels
      responses:
        '200':
          description: Secret-free channel read models.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [channels]
      operationId: createChannel
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '201':
          $ref: '#/components/responses/ChannelResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/channels/{id}:
    parameters:
      - $ref: '#/components/parameters/ChannelID'
    put:
      tags: [channels]
      operationId: updateChannel
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelInput'
      responses:
        '200':
          $ref: '#/components/responses/ChannelResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [channels]
      operationId: deleteChannel
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Channel deleted.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/channels/{id}/test:
    parameters:
      - $ref: '#/components/parameters/ChannelID'
    post:
      tags: [channels]
      operationId: testChannel
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '200':
          description: Test notification accepted by the channel.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentStatus'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ChannelConfigurationError'
        '502':
          $ref: '#/components/responses/UpstreamError'
  /api/v4/channels/{id}/microsoft-login:
    parameters:
      - $ref: '#/components/parameters/ChannelID'
    post:
      tags: [login]
      operationId: startMicrosoftLogin
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '201':
          description: Device authorization session created.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicrosoftLogin'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [login]
      operationId: cancelMicrosoftLogin
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: Device authorization session cancelled.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
  /api/v4/deliveries:
    get:
      tags: [deliveries]
      operationId: listDeliveries
      parameters:
        - $ref: '#/components/parameters/DeliveryLimit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Stable immutable created-at/id descending delivery page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/deliveries/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/DeliveryID'
    post:
      tags: [deliveries]
      operationId: retryDelivery
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        '202':
          description: Delivery requeued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedStatus'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/microsoft-logins:
    get:
      tags: [login]
      operationId: listMicrosoftLogins
      responses:
        '200':
          description: Active Microsoft device authorization sessions.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MicrosoftLogin'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /api/v4/audit-logs:
    get:
      tags: [audit]
      operationId: listAuditLogs
      parameters:
        - name: action
          in: query
          schema: {type: string}
        - name: outcome
          in: query
          schema:
            type: string
            enum: [success, failure, denied]
        - name: resource_type
          in: query
          schema: {type: string}
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/AuditLimit'
        - $ref: '#/components/parameters/After'
      responses:
        '200':
          description: Stable occurred-at/id descending audit page.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v4/ai/status:
    get:
      tags: [ai]
      operationId: getAIWorkerStatus
      responses:
        '200': {description: Current AI Worker capabilities., content: {application/json: {schema: {$ref: '#/components/schemas/AIWorkerStatus'}}}}
        '401': {$ref: '#/components/responses/AuthenticationError'}
  /api/v4/ai/profiles:
    get:
      tags: [ai]
      operationId: listAIProfiles
      responses:
        '200': {description: Model profiles without secret values., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AIProfile'}}}}}
    post:
      tags: [ai]
      operationId: createAIProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIProfileInput'}}}}
      responses:
        '201': {description: Created model profile., content: {application/json: {schema: {$ref: '#/components/schemas/AIProfile'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v4/ai/profiles/{id}:
    parameters: [{$ref: '#/components/parameters/AIID'}]
    put:
      tags: [ai]
      operationId: updateAIProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIProfileInput'}}}}
      responses:
        '200': {description: Updated model profile., content: {application/json: {schema: {$ref: '#/components/schemas/AIProfile'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
    delete:
      tags: [ai]
      operationId: deleteAIProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Profile deleted.}
        '409': {$ref: '#/components/responses/ConflictError'}
  /api/v4/ai/profiles/{id}/test:
    parameters: [{$ref: '#/components/parameters/AIID'}]
    post:
      tags: [ai]
      operationId: testAIProfile
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '200': {description: Completed real provider connectivity probe., content: {application/json: {schema: {$ref: '#/components/schemas/AIProfileTestResult'}}}}
        '404': {$ref: '#/components/responses/NotFoundError'}
  /api/v4/ai/profiles/{id}/availability:
    parameters: [{$ref: '#/components/parameters/AIID'}]
    put:
      tags: [ai]
      operationId: updateAIProfileAvailability
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIProfileAvailabilityInput'}}}}
      responses:
        '200': {description: Updated model profile availability., content: {application/json: {schema: {$ref: '#/components/schemas/AIProfile'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '404': {$ref: '#/components/responses/NotFoundError'}
  /api/v4/ai/prompts:
    get:
      tags: [ai]
      operationId: listAIPrompts
      responses:
        '200': {description: Summary prompt templates., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AIPrompt'}}}}}
    post:
      tags: [ai]
      operationId: createAIPrompt
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIPromptInput'}}}}
      responses:
        '201': {description: Created prompt., content: {application/json: {schema: {$ref: '#/components/schemas/AIPrompt'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v4/ai/prompts/{id}:
    parameters: [{$ref: '#/components/parameters/AIID'}]
    put:
      tags: [ai]
      operationId: updateAIPrompt
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AIPromptInput'}}}}
      responses:
        '200': {description: Updated prompt., content: {application/json: {schema: {$ref: '#/components/schemas/AIPrompt'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
    delete:
      tags: [ai]
      operationId: deleteAIPrompt
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Prompt deleted.}
        '409': {$ref: '#/components/responses/ConflictError'}
  /api/v4/ai/transcriptions:
    post:
      tags: [ai]
      operationId: createAITranscription
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AITranscriptionInput'}}}}
      responses:
        '202': {description: Durable transcription job., content: {application/json: {schema: {$ref: '#/components/schemas/AIJob'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v4/ai/summaries:
    post:
      tags: [ai]
      operationId: createAISummary
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AISummaryInput'}}}}
      responses:
        '202': {description: Durable summary job., content: {application/json: {schema: {$ref: '#/components/schemas/AIJob'}}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
  /api/v4/ai/jobs:
    get:
      tags: [ai]
      operationId: listAIJobs
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [transcription, summary]}}
        - {name: state, in: query, schema: {type: string, enum: [queued, running, succeeded, failed, canceled]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        '200': {description: AI job page; list entries omit encrypted input and result., content: {application/json: {schema: {$ref: '#/components/schemas/AIJobPage'}}}}
  /api/v4/ai/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/AIID'}]
    get:
      tags: [ai]
      operationId: getAIJob
      responses:
        '200': {description: AI job detail including decrypted input and result., content: {application/json: {schema: {$ref: '#/components/schemas/AIJob'}}}}
        '404': {$ref: '#/components/responses/NotFoundError'}
    delete:
      tags: [ai]
      operationId: deleteAIJob
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Terminal job deleted.}
        '409': {$ref: '#/components/responses/ConflictError'}
  /api/v4/ai/jobs/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/AIID'}]
    post:
      tags: [ai]
      operationId: cancelAIJob
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '202': {description: Cancellation accepted., content: {application/json: {schema: {type: object, additionalProperties: false, required: [status], properties: {status: {const: canceled}}}}}}
        '409': {$ref: '#/components/responses/ConflictError'}
  /api/v4/ai/jobs/{id}/retry:
    parameters: [{$ref: '#/components/parameters/AIID'}]
    post:
      tags: [ai]
      operationId: retryAIJob
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '202': {description: Job queued again., content: {application/json: {schema: {$ref: '#/components/schemas/QueuedStatus'}}}}
        '409': {$ref: '#/components/responses/ConflictError'}
  /api/v4/ws:
    get:
      tags: [runtime]
      operationId: connectRealtime
      description: |
        WebSocket upgrade endpoint. The server first sends `sync.required` and
        subsequently sends `resources.invalidated`. Messages never contain resource data.
      responses:
        '101':
          description: WebSocket upgraded. Messages conform to RealtimeEvent.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          $ref: '#/components/responses/CSRFError'
  /api/v4/accounts:
    get:
      tags: [accounts]
      operationId: listPlatformAccounts
      responses:
        '200':
          description: Independent platform account states without session secrets.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PlatformAccount'}}
  /api/v4/accounts/bilibili/qr:
    get:
      tags: [accounts]
      operationId: getBilibiliQRLogin
      responses:
        '200':
          description: Current Bilibili QR login transaction or null.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/BilibiliLogin'}
                  - {type: 'null'}
    post:
      tags: [accounts]
      operationId: startBilibiliQRLogin
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '201':
          description: Bilibili QR login transaction.
          content: {application/json: {schema: {$ref: '#/components/schemas/BilibiliLogin'}}}
  /api/v4/accounts/bilibili/qr/{id}:
    delete:
      tags: [accounts]
      operationId: cancelBilibiliQRLogin
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: QR login transaction cancelled.}
  /api/v4/accounts/bilibili/session:
    delete:
      tags: [accounts]
      operationId: deleteBilibiliSession
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Bilibili account disconnected.}}
  /api/v4/accounts/zsxq/token:
    post:
      tags: [accounts]
      operationId: importZSXQToken
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cookie]
              properties: {cookie: {type: string, minLength: 1}}
      responses:
        '201':
          description: Connected Knowledge Planet account.
          content: {application/json: {schema: {$ref: '#/components/schemas/PlatformAccount'}}}
        '400': {$ref: '#/components/responses/InvalidRequest'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
  /api/v4/accounts/zsxq/session:
    delete:
      tags: [accounts]
      operationId: deleteZSXQSession
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Knowledge Planet account disconnected.}}
  /api/v4/accounts/zsxq/groups:
    get:
      tags: [accounts]
      operationId: listZSXQGroups
      responses:
        '200':
          description: Knowledge Planet groups visible to the connected account.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ZSXQGroup'}}}}
        '409': {$ref: '#/components/responses/ConflictError'}
        '429': {$ref: '#/components/responses/RateLimitError'}
        '502': {$ref: '#/components/responses/UpstreamError'}
  /api/v4/sources:
    get:
      tags: [sources]
      operationId: listSources
      parameters:
        - {name: platform, in: query, schema: {type: string, enum: [bilibili, zsxq]}}
      responses:
        '200':
          description: Collection sources.
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Source'}}}}
  /api/v4/sources/bilibili:
    post:
      tags: [sources]
      operationId: createBilibiliSource
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateBilibiliSourceRequest'}}}
      responses:
        '201': {description: Source created, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
  /api/v4/sources/zsxq:
    post:
      tags: [sources]
      operationId: createZSXQSource
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateZSXQSourceRequest'}}}
      responses:
        '201': {description: Source created from a group visible to the connected account, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}
        '409': {$ref: '#/components/responses/ConflictError'}
        '422': {$ref: '#/components/responses/InvalidRequest'}
  /api/v4/sources/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    put:
      tags: [sources]
      operationId: updateSource
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateSourceRequest'}}}
      responses: {'200': {description: Source updated, content: {application/json: {schema: {$ref: '#/components/schemas/Source'}}}}}
    delete:
      tags: [sources]
      operationId: deleteSource
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses: {'204': {description: Source and archive removed.}}
  /api/v4/contents:
    get:
      tags: [history]
      operationId: listContents
      parameters:
        - {name: platform, in: query, schema: {type: string, enum: [bilibili, zsxq]}}
        - {name: source_id, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: after, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Unified content page.
          content: {application/json: {schema: {$ref: '#/components/schemas/ContentPage'}}}
  /api/v4/contents/{id}:
    get:
      tags: [history]
      operationId: getContent
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Content with attachment metadata.
          content:
            application/json:
              schema:
                type: object
                required: [content, attachments]
                properties:
                  content: {$ref: '#/components/schemas/Content'}
                  attachments: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
  /api/v4/contents/{id}/comments:
    get:
      tags: [history]
      operationId: getContentCommentTree
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Stable nested comment tree.
          content:
            application/json:
              schema:
                type: object
                required: [children, incomplete]
                properties:
                  children: {type: array, items: {$ref: '#/components/schemas/CommentTreeNode'}}
                  incomplete: {type: boolean}
  /api/v4/contents/{id}/attachments/{attachment_id}:
    get:
      tags: [history]
      operationId: downloadAttachment
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: attachment_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Authenticated attachment stream with Range support.}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bili_notify_session
  headers:
    RequestID:
      description: Server-generated request correlation identifier.
      schema:
        type: string
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 1}
    ChannelID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    DeliveryID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AIID:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Search:
      name: q
      in: query
      schema: {type: string}
    From:
      name: from
      in: query
      description: Inclusive RFC3339 lower bound.
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      description: Exclusive RFC3339 upper bound.
      schema: {type: string, format: date-time}
    After:
      name: after
      in: query
      description: Opaque next_cursor returned by the preceding page.
      schema: {type: string, maxLength: 1024}
    ContentLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    DeliveryLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    AuditLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
  responses:
    SessionResponse:
      description: Current initialization and authentication state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    CSRFResponse:
      description: Authenticated session created or replaced.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Set-Cookie:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CSRFToken'
    SettingsResponse:
      description: Complete runtime settings.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuntimeSettings'
    ChannelResponse:
      description: Secret-free channel read model.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Channel'
    InvalidRequest:
      description: Invalid JSON, query, cursor, or validation failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    AuthenticationError:
      description: Authentication required or credentials invalid.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CSRFError:
      description: CSRF token or WebSocket origin rejected.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Resource not found.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Resource state conflicts with the operation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimitError:
      description: Authentication attempts are rate limited.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamError:
      description: Upstream notification provider failed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ChannelConfigurationError:
      description: The notification provider rejected a fixable channel configuration or permission setting.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal server failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            fields:
              type: object
              additionalProperties: {type: string}
    Session:
      type: object
      additionalProperties: false
      required: [setup_required, authenticated]
      properties:
        setup_required: {type: boolean}
        authenticated: {type: boolean}
        csrf_token: {type: string}
    CSRFToken:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token: {type: string, minLength: 1}
    SetupRequest:
      type: object
      additionalProperties: false
      required: [setup_code, password]
      properties:
        setup_code: {type: string, minLength: 1}
        password: {type: string, minLength: 12}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string}
        new_password: {type: string, minLength: 12}
    Runtime:
      type: object
      additionalProperties: false
      required: [status, timezone, updated_at]
      properties:
        status:
          $ref: '#/components/schemas/Status'
        timezone: {type: string, minLength: 1}
        updated_at: {type: string, format: date-time}
    Status:
      type: object
      additionalProperties: false
      required: [auth_valid, up_count, channel_count, outbox_depth, ready]
      properties:
        auth_valid: {type: boolean}
        bili_account:
          $ref: '#/components/schemas/BiliAccount'
        last_success_at: {type: string, format: date-time}
        up_count: {type: integer, minimum: 0}
        channel_count: {type: integer, minimum: 0}
        outbox_depth: {type: integer, minimum: 0}
        oldest_delivery: {type: string, format: date-time}
        ready: {type: boolean}
        risk_paused_until: {type: string, format: date-time}
    BiliAccount:
      type: object
      additionalProperties: false
      required: [uid, name]
      properties:
        uid: {type: string}
        name: {type: string}
    PlatformAccount:
      type: object
      additionalProperties: false
      required: [platform, status]
      properties:
        platform: {type: string, enum: [bilibili, zsxq]}
        external_id: {type: string}
        display_name: {type: string}
        masked_phone: {type: string}
        status: {type: string, enum: [disconnected, connected, invalid, risk_paused]}
        verified_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        risk_paused_until: {type: string, format: date-time}
        last_error: {type: string}
    ZSXQGroup:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        name: {type: string, minLength: 1}
        owner_id: {type: string, pattern: '^[1-9][0-9]*$'}
        owner_name: {type: string}
    Source:
      type: object
      additionalProperties: false
      required: [id, platform, type, external_id, name, enabled, baseline_state, backfill_done, backfill_total, sync_lag_sec, consecutive_fails]
      properties:
        id: {type: string}
        platform: {type: string, enum: [bilibili, zsxq]}
        type: {type: string, enum: [up, planet]}
        external_id: {type: string}
        name: {type: string}
        note: {type: string}
        owner_id: {type: string}
        owner_name: {type: string}
        enabled: {type: boolean}
        baseline_state: {type: string, enum: [pending, running, complete, failed]}
        backfill_cursor: {type: string}
        high_watermark: {type: string}
        backfill_done: {type: integer, format: int64}
        backfill_total: {type: integer, format: int64}
        last_poll_at: {type: string, format: date-time}
        last_success_at: {type: string, format: date-time}
        last_comment_at: {type: string, format: date-time}
        sync_lag_sec: {type: integer, format: int64}
        last_error: {type: string}
        consecutive_fails: {type: integer}
    CreateBilibiliSourceRequest:
      type: object
      additionalProperties: false
      required: [uid, name, note, enabled]
      properties:
        uid: {type: string, pattern: '^[1-9][0-9]*$'}
        name: {type: string}
        note: {type: string}
        enabled: {type: boolean}
    CreateZSXQSourceRequest:
      type: object
      additionalProperties: false
      required: [group_id, note, enabled]
      properties:
        group_id: {type: string, pattern: '^[1-9][0-9]*$'}
        note: {type: string}
        enabled: {type: boolean}
    UpdateSourceRequest:
      type: object
      additionalProperties: false
      required: [name, note, enabled]
      properties:
        name: {type: string}
        note: {type: string}
        enabled: {type: boolean}
    Content:
      type: object
      additionalProperties: false
      required: [id, platform, source_id, external_id, upstream_type, type, published_at, first_seen_at, last_synced_at, baseline]
      properties:
        id: {type: string}
        platform: {type: string, enum: [bilibili, zsxq]}
        source_id: {type: string}
        external_id: {type: string}
        author_id: {type: string}
        author_name: {type: string}
        upstream_type: {type: string}
        type: {type: string, enum: [dynamic, video, article, discussion, question, answer, task, long_article]}
        title: {type: string}
        text: {type: string}
        safe_html: {type: string}
        url: {type: string}
        published_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        first_seen_at: {type: string, format: date-time}
        last_synced_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        stats: {type: object, additionalProperties: {type: integer, format: int64}}
        tree_incomplete: {type: boolean}
        baseline: {type: boolean}
    Attachment:
      type: object
      additionalProperties: false
      required: [id, content_id, external_id, type, localized]
      properties:
        id: {type: string}
        content_id: {type: string}
        external_id: {type: string}
        type: {type: string, enum: [image, file, audio, video, link]}
        file_name: {type: string}
        mime: {type: string}
        size: {type: integer, format: int64}
        width: {type: integer}
        height: {type: integer}
        duration_sec: {type: integer, format: int64}
        remote_host: {type: string}
        localized: {type: boolean}
        localize_error: {type: string}
    CommentTreeNode:
      type: object
      additionalProperties: false
      required: [id, platform, content_id, author_role, name, message, published_at]
      properties:
        id: {type: string}
        platform: {type: string, enum: [bilibili, zsxq]}
        content_id: {type: string}
        root_id: {type: string}
        parent_id: {type: string}
        author_id: {type: string}
        author_role: {type: string, enum: [owner, admin, guest, partner, member, up]}
        updated_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
        media: {type: array, items: {$ref: '#/components/schemas/Attachment'}}
        children: {type: array, items: {$ref: '#/components/schemas/CommentTreeNode'}}
        name: {type: string}
        message: {type: string}
        published_at: {type: string, format: date-time}
        is_trigger: {type: boolean}
    ContentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Content'}}
        page: {$ref: '#/components/schemas/PageMetadata'}
    RuntimeSettings:
      type: object
      additionalProperties: false
      required:
        - bilibili_dynamic_interval_sec
        - bilibili_request_rate
        - bilibili_request_concurrency
        - bilibili_comments_enabled
        - bilibili_comment_track_n
        - bilibili_comment_interval_sec
        - bilibili_relation_refresh_interval_sec
        - bilibili_space_reconcile_interval_sec
        - bilibili_max_dynamic_pages
        - bilibili_risk_pause_sec
        - zsxq_dynamic_interval_sec
        - zsxq_comment_interval_sec
        - zsxq_comments_enabled
        - zsxq_request_rate
        - zsxq_request_concurrency
        - zsxq_risk_pause_sec
        - zsxq_asset_max_file_mib
        - zsxq_asset_total_budget_gib
        - log_level
        - audit_log_retention_days
        - delivery_concurrency
        - backlog_alert_count
        - backlog_alert_age_sec
        - delivery_retry_delays_sec
        - ai_auto_processing_enabled
      properties:
        bilibili_dynamic_interval_sec: {type: integer, minimum: 10, maximum: 86400}
        bilibili_request_rate: {type: number, exclusiveMinimum: 0, maximum: 10}
        bilibili_request_concurrency: {type: integer, minimum: 1, maximum: 16}
        bilibili_comments_enabled: {type: boolean}
        bilibili_comment_track_n: {type: integer, minimum: 1, maximum: 50}
        bilibili_comment_interval_sec: {type: integer, minimum: 30, maximum: 86400}
        bilibili_relation_refresh_interval_sec: {type: integer, minimum: 60, maximum: 86400}
        bilibili_space_reconcile_interval_sec: {type: integer, minimum: 300, maximum: 604800}
        bilibili_max_dynamic_pages: {type: integer, minimum: 1, maximum: 20}
        bilibili_risk_pause_sec: {type: integer, minimum: 60, maximum: 3600}
        zsxq_dynamic_interval_sec: {type: integer, minimum: 30, maximum: 86400}
        zsxq_comment_interval_sec: {type: integer, minimum: 30, maximum: 86400}
        zsxq_comments_enabled: {type: boolean}
        zsxq_request_rate: {type: number, exclusiveMinimum: 0, maximum: 10}
        zsxq_request_concurrency: {type: integer, minimum: 1, maximum: 16}
        zsxq_risk_pause_sec: {type: integer, minimum: 60, maximum: 3600}
        zsxq_asset_max_file_mib: {type: integer, minimum: 1, maximum: 2048}
        zsxq_asset_total_budget_gib: {type: integer, minimum: 1, maximum: 10240}
        log_level: {type: string, enum: [debug, info, warn, error]}
        audit_log_retention_days: {type: integer, minimum: 1, maximum: 3650}
        delivery_concurrency: {type: integer, minimum: 1, maximum: 32}
        backlog_alert_count: {type: integer, minimum: 1, maximum: 100000}
        backlog_alert_age_sec: {type: integer, minimum: 60, maximum: 86400}
        delivery_retry_delays_sec:
          type: array
          description: Five retry delays in nondecreasing order.
          minItems: 5
          maxItems: 5
          items: {type: integer, minimum: 1, maximum: 86400}
        ai_auto_processing_enabled:
          type: boolean
          description: Automatically transcribe and summarize newly discovered top-level video dynamics using the enabled default AI profiles and prompt.
    ChannelInput:
      type: object
      additionalProperties: false
      required: [name, type, enabled, settings]
      properties:
        name: {type: string, minLength: 1}
        type: {type: string, enum: [email, microsoft, dingtalk, feishu, wecom]}
        enabled: {type: boolean}
        settings:
          type: object
          description: Public channel settings. Feishu accepts only app_id and chat_id; its legacy webhook settings are not supported.
          additionalProperties: {type: string}
        secrets:
          type: object
          description: Write-only channel secrets. Feishu accepts only app_secret; Microsoft OAuth tokens are managed by device authorization.
          additionalProperties: {type: string}
    Channel:
      type: object
      additionalProperties: false
      required: [id, name, type, enabled, settings, configured_secrets, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string, enum: [email, microsoft, dingtalk, feishu, wecom]}
        enabled: {type: boolean}
        settings:
          type: object
          additionalProperties: {type: string}
        configured_secrets:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PageMetadata:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          description: Empty when has_more is false; otherwise pass unchanged as after.
        has_more: {type: boolean}
    DeliveryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
        page:
          $ref: '#/components/schemas/PageMetadata'
    Delivery:
      type: object
      additionalProperties: false
      required: [id, kind, channel_id, state, attempts, next_at, created_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [content, comment, ai, system]}
        platform: {type: string, enum: [bilibili, zsxq]}
        source_id: {type: string}
        content_id: {type: string}
        channel_id: {type: string}
        state: {type: string, enum: [pending, blocked]}
        attempts: {type: integer, minimum: 0}
        next_at: {type: string, format: date-time}
        last_error: {type: string}
        created_at: {type: string, format: date-time}
        title: {type: string}
        summary: {type: string}
    SentStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {const: sent}
    QueuedStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {const: queued}
    BilibiliLogin:
      type: object
      additionalProperties: false
      required: [id, status, expires_at]
      properties:
        id: {type: string}
        status: {type: string}
        expires_at: {type: string, format: date-time}
        qr_data_url: {type: string}
    MicrosoftLogin:
      type: object
      additionalProperties: false
      required: [channel_id, status]
      properties:
        channel_id: {type: string}
        status: {type: string}
        user_code: {type: string}
        verification_uri: {type: string}
        verification_uri_complete: {type: string}
        expires_at: {type: string, format: date-time}
        error: {type: string}
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        page:
          $ref: '#/components/schemas/PageMetadata'
    AuditLog:
      type: object
      additionalProperties: false
      required:
        - id
        - occurred_at
        - request_id
        - actor
        - session_id
        - remote_ip
        - user_agent
        - action
        - resource_type
        - resource_id
        - outcome
        - http_method
        - route
        - status_code
        - duration_ms
        - details
      properties:
        id: {type: integer, format: int64}
        occurred_at: {type: string, format: date-time}
        request_id: {type: string}
        actor: {type: string}
        session_id: {type: string}
        remote_ip: {type: string}
        user_agent: {type: string}
        action: {type: string}
        resource_type: {type: string}
        resource_id: {type: string}
        outcome: {type: string, enum: [success, failure, denied]}
        http_method: {type: string}
        route: {type: string}
        status_code: {type: integer}
        error_code: {type: string}
        duration_ms: {type: integer, format: int64}
        details:
          type: object
          additionalProperties: true
    AIWorkerStatus:
      type: object
      additionalProperties: false
      required: [connected, yt_dlp_available, ffmpeg_available, active_transcriptions, active_summaries, cache_bytes]
      properties:
        connected: {type: boolean}
        version: {type: string}
        yt_dlp_available: {type: boolean}
        ffmpeg_available: {type: boolean}
        active_transcriptions: {type: integer}
        active_summaries: {type: integer}
        cache_bytes: {type: integer, format: int64}
        last_checked_at: {type: string, format: date-time}
        last_error: {type: string}
    AIProfileInput:
      type: object
      additionalProperties: false
      required: [name, kind, base_url, model, timeout_sec, enabled, default]
      properties:
        name: {type: string, minLength: 1}
        kind: {type: string, enum: [transcription, text]}
        base_url: {type: string, format: uri}
        model: {type: string, minLength: 1}
        api_key: {type: string, writeOnly: true}
        language: {type: string}
        prompt: {type: string}
        temperature: {type: number, minimum: 0, maximum: 2}
        max_output_tokens: {type: [integer, 'null'], minimum: 0, description: 'Omit, null, or zero to use the provider default.'}
        context_window_chars: {type: integer, minimum: 0}
        timeout_sec: {type: integer, minimum: 10, maximum: 86400}
        enabled: {type: boolean}
        default: {type: boolean}
    AIProfileAvailabilityInput:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    AIProfile:
      allOf:
        - $ref: '#/components/schemas/AIProfileInput'
        - type: object
          required: [id, configured_secrets, created_at, updated_at]
          properties:
            id: {type: string}
            configured_secrets: {type: array, items: {type: string, enum: [api_key]}}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    AIProfileTestResult:
      type: object
      additionalProperties: false
      required: [ok, latency_ms, message]
      properties:
        ok: {type: boolean}
        latency_ms: {type: integer, format: int64, minimum: 0}
        message: {type: string}
        error_code: {type: string}
        provider_http_status: {type: integer}
        provider_error: {type: string}
    AIPromptInput:
      type: object
      additionalProperties: false
      required: [name, system_prompt, chunk_prompt, reduce_prompt, default]
      properties:
        name: {type: string, minLength: 1}
        system_prompt: {type: string}
        chunk_prompt: {type: string, minLength: 1}
        reduce_prompt: {type: string, minLength: 1}
        default: {type: boolean}
    AIPrompt:
      allOf:
        - $ref: '#/components/schemas/AIPromptInput'
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id: {type: string}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    AITranscriptionInput:
      type: object
      additionalProperties: false
      required: [client_request_id, bvid, profile_id]
      properties:
        client_request_id: {type: string, minLength: 1}
        bvid: {type: string, pattern: '^BV[0-9A-Za-z]{10}$'}
        page: {type: integer, minimum: 0}
        profile_id: {type: string, minLength: 1}
    AIContentSnapshot:
      type: object
      additionalProperties: false
      required: [content_id]
      properties:
        content_id: {type: string}
        bvid: {type: string}
        author: {type: string}
        title: {type: string}
        url: {type: string}
    AIJobTranscriptionInput:
      type: object
      additionalProperties: false
      required: [bvid]
      properties:
        bvid: {type: string}
        page: {type: integer, minimum: 0}
    AIJobSummaryInput:
      type: object
      additionalProperties: false
      properties:
        text: {type: string}
        transcription_job_id: {type: string}
    AISummaryInput:
      type: object
      additionalProperties: false
      required: [client_request_id, profile_id, prompt_id]
      properties:
        client_request_id: {type: string, minLength: 1}
        text: {type: string}
        transcription_job_id: {type: string}
        profile_id: {type: string, minLength: 1}
        prompt_id: {type: string, minLength: 1}
    AITranscriptSegment:
      type: object
      additionalProperties: false
      required: [start_ms, end_ms, text]
      properties:
        start_ms: {type: integer, format: int64, minimum: 0}
        end_ms: {type: integer, format: int64, minimum: 0}
        text: {type: string}
    AITranscriptionResult:
      type: object
      additionalProperties: false
      required: [bvid, title, pages]
      properties:
        bvid: {type: string}
        title: {type: string}
        pages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [page, title, duration_ms, segments]
            properties:
              page: {type: integer, minimum: 1}
              cid: {type: string}
              title: {type: string}
              duration_ms: {type: integer, format: int64, minimum: 0}
              segments: {type: array, items: {$ref: '#/components/schemas/AITranscriptSegment'}}
        usage: {type: object, additionalProperties: true}
    AISummaryResult:
      type: object
      additionalProperties: false
      required: [markdown]
      properties:
        markdown: {type: string}
        usage: {type: object, additionalProperties: true}
    AIJob:
      type: object
      additionalProperties: false
      required: [id, kind, state, stage, progress, profile_id, origin, attempts, created_at, updated_at]
      properties:
        id: {type: string}
        client_request_id: {type: string}
        kind: {type: string, enum: [transcription, summary]}
        state: {type: string, enum: [queued, running, succeeded, failed, canceled, skipped]}
        stage: {type: string}
        progress: {type: integer, minimum: 0, maximum: 100}
        profile_id: {type: string}
        prompt_id: {type: string}
        origin: {type: string, enum: [workbench, dynamic]}
        source_content_id: {type: string}
        depends_on_job_id: {type: string}
        attempts: {type: integer, minimum: 0}
        error_code: {type: string}
        last_error: {type: string}
        source:
          $ref: '#/components/schemas/AIContentSnapshot'
        transcription_input:
          $ref: '#/components/schemas/AIJobTranscriptionInput'
        summary_input:
          $ref: '#/components/schemas/AIJobSummaryInput'
        transcription_result:
          $ref: '#/components/schemas/AITranscriptionResult'
        summary_result:
          $ref: '#/components/schemas/AISummaryResult'
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AIJobPage:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AIJob'}}
        total: {type: integer, format: int64, minimum: 0}
        limit: {type: integer, minimum: 1}
        offset: {type: integer, minimum: 0}
    RealtimeEvent:
      type: object
      additionalProperties: false
      required: [event, revision, topics]
      properties:
        event:
          type: string
          enum: [sync.required, resources.invalidated]
        revision:
          type: integer
          format: int64
          minimum: 0
        topics:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - runtime
              - settings
              - channels
              - deliveries
              - microsoft-logins
              - audit-logs
              - ai-status
              - ai-jobs
              - accounts
              - sources
              - contents
              - backfills
