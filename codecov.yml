coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%
    patch:
      default:
        target: 80%
        threshold: 0%

# go tool cover counts a partially-covered line as a hit; Codecov defaults to
# counting those lines as partials, which under-reports vs make coverage.
parsers:
  go:
    partials_as_hits: true

flags:
  core-go:
    paths:
      - bilibili/
      - notify/
      - service/
      - state/
      - web/
    carryforward: false
