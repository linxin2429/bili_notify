# Bili Notify with OpenTelemetry Collector, Prometheus, Loki, Tempo, and Grafana.
# export GRAFANA_ADMIN_PASSWORD='use-a-dedicated-strong-password'
# docker compose -f compose.full.yaml up -d
services:
  bili-notify:
    image: dengxinlin/bili-notify:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: bili-notify
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8443}:8443"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BILI_NOTIFY_DATA_DIR: /data
      BILI_NOTIFY_ADMIN_ADDR: ":8443"
      BILI_NOTIFY_OBSERVE_ADDR: ":9090"
      BILI_NOTIFY_LOG_LEVEL: ${BILI_NOTIFY_LOG_LEVEL:-info}
      BILI_NOTIFY_AUDIT_LOG_RETENTION: ${BILI_NOTIFY_AUDIT_LOG_RETENTION:-4320h}
      BILI_NOTIFY_POLL_INTERVAL: ${BILI_NOTIFY_POLL_INTERVAL:-30s}
      BILI_NOTIFY_REQUEST_RATE: ${BILI_NOTIFY_REQUEST_RATE:-2}
      BILI_NOTIFY_REQUEST_CONCURRENCY: ${BILI_NOTIFY_REQUEST_CONCURRENCY:-4}
      BILI_NOTIFY_OTEL_SDK_DISABLED: "false"
      BILI_NOTIFY_OTEL_SERVICE_NAME: bili-notify
      BILI_NOTIFY_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      BILI_NOTIFY_OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      BILI_NOTIFY_OTEL_METRIC_EXPORT_INTERVAL: 15s
      BILI_NOTIFY_OTEL_DEPLOYMENT_ENVIRONMENT: production
    volumes:
      - bili-notify-data:/data
    depends_on: [otel-collector]
    read_only: true
    tmpfs: [/tmp:size=16m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/bili-notify", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - bili-notify-otelcol:/var/lib/otelcol/storage
    depends_on: [loki, tempo]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
      - bili-notify-prometheus:/prometheus
    depends_on: [otel-collector]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  loki:
    image: grafana/loki:3.7.6
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - bili-notify-loki:/loki
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - bili-notify-tempo:/var/tempo
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before startup}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - bili-notify-grafana:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  bili-notify-data:
  bili-notify-otelcol:
  bili-notify-prometheus:
  bili-notify-loki:
  bili-notify-tempo:
  bili-notify-grafana:
