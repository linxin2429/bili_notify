# Bili Notify with Alloy, Loki, and Grafana.
#
# Required before startup:
#   export GRAFANA_ADMIN_PASSWORD='use-a-dedicated-strong-password'
#   docker compose -f compose.full.yaml up -d

services:
  bili-notify:
    image: dengxinlin/bili-notify:${IMAGE_TAG:-0.2.0}
    container_name: bili-notify
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8443}:8443"
      # Expose health, readiness, and metrics only when external access is required.
      # - "${OBSERVE_PORT:-9090}:9090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BILI_NOTIFY_DATA_DIR: /data
      BILI_NOTIFY_ADMIN_ADDR: ":8443"
      BILI_NOTIFY_OBSERVE_ADDR: ":9090"
      BILI_NOTIFY_LOG_LEVEL: ${BILI_NOTIFY_LOG_LEVEL:-info}
      BILI_NOTIFY_AUDIT_LOG_RETENTION: ${BILI_NOTIFY_AUDIT_LOG_RETENTION:-4320h}
      BILI_NOTIFY_SYSTEM_LOG_RETENTION: ${BILI_NOTIFY_SYSTEM_LOG_RETENTION:-720h}
      BILI_NOTIFY_POLL_INTERVAL: ${BILI_NOTIFY_POLL_INTERVAL:-30s}
      BILI_NOTIFY_REQUEST_RATE: ${BILI_NOTIFY_REQUEST_RATE:-2}
      BILI_NOTIFY_REQUEST_CONCURRENCY: ${BILI_NOTIFY_REQUEST_CONCURRENCY:-4}
    volumes:
      - bili-notify-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bili-notify", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  loki:
    image: grafana/loki:3.7.5
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      BILI_NOTIFY_SYSTEM_LOG_RETENTION: ${BILI_NOTIFY_SYSTEM_LOG_RETENTION:-720h}
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - bili-notify-loki:/loki
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  alloy:
    image: grafana/alloy:v1.18.0
    user: "0:0"
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/observability/alloy.config:/etc/alloy/config.alloy:ro
      - bili-notify-data:/bili-data:ro
      - bili-notify-alloy:/var/lib/alloy/data
    depends_on:
      - bili-notify
      - loki
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.1.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD before startup}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - bili-notify-grafana:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  bili-notify-data:
  bili-notify-loki:
  bili-notify-alloy:
  bili-notify-grafana:
