# Bili Notify — pull from Docker Hub
#
# 镜像：dengxinlin/bili-notify（tag 由 git tag vX.Y.Z 发布时推送）
#   0.2.0 / 0.2 / 0 / latest
#
# 数据卷首次启动自动创建：
#   /data/data.db     SQLite（配置、Outbox、内容档案；启动 goose 迁移）
#   /data/master.key  AES-256 主密钥
#   /data/tls.pem     自签名 TLS
#
# 注意：v0.2+ 不再使用 state.db / content.db。若命名卷里还有旧文件，
# 服务会拒绝启动；请换新卷或清空后重建。
#
# 使用：
#   docker-compose pull
#   docker-compose up -d
#   docker-compose logs -f bili-notify
#   # 打开 https://localhost:8443 ，用日志中的 setup_code 初始化管理员

version: "3.8"

services:
  bili-notify:
    image: dengxinlin/bili-notify:${IMAGE_TAG:-0.2.0}
    container_name: bili-notify
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8443}:8443"
      # 需要 /healthz /readyz /metrics 时取消注释：
      # - "${OBSERVE_PORT:-9090}:9090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BILI_NOTIFY_DATA_DIR: /data
      BILI_NOTIFY_ADMIN_ADDR: ":8443"
      BILI_NOTIFY_OBSERVE_ADDR: ":9090"
      BILI_NOTIFY_LOG_LEVEL: ${BILI_NOTIFY_LOG_LEVEL:-info}
      # 仅空库首次启动写入 data.db，之后由管理台热更新
      BILI_NOTIFY_POLL_INTERVAL: ${BILI_NOTIFY_POLL_INTERVAL:-30s}
      BILI_NOTIFY_REQUEST_RATE: ${BILI_NOTIFY_REQUEST_RATE:-2}
      BILI_NOTIFY_REQUEST_CONCURRENCY: ${BILI_NOTIFY_REQUEST_CONCURRENCY:-4}
    volumes:
      - bili-notify-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/bili-notify", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  bili-notify-data:
