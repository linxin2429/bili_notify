apiVersion: 1

datasources:
  - name: Bili Notify Prometheus
    uid: bili-notify-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: bili-notify-tempo
  - name: Bili Notify Loki
    uid: bili-notify-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # OTLP logs land as message body + structured metadata/labels.
      # trace_id is NOT in the line text, so regex-on-body never links.
      derivedFields:
        - name: TraceID
          datasourceUid: bili-notify-tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View Trace
  - name: Bili Notify Tempo
    uid: bili-notify-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: bili-notify-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        # Map span resource.service.name -> Loki label service_name.
        tags:
          - key: service.name
            value: service_name
        # Do not use body substring filters: OTLP log lines are bare messages.
        # Filter structured metadata instead (verified working LogQL).
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: bili-notify-prometheus
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: bili-notify-prometheus
      nodeGraph:
        enabled: true
