<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bili Notify</title>
  <style>
    :root{color-scheme:dark;--bg:#10131a;--card:#1b202b;--line:#303747;--text:#edf2f7;--muted:#9aa6b2;--accent:#54c7ec;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--text)}main{max-width:1100px;margin:auto;padding:28px}h1{margin:0 0 22px}h2{font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}input,select,textarea,button{width:100%;margin:5px 0;padding:10px;border:1px solid var(--line);border-radius:7px;background:#111620;color:var(--text)}button{cursor:pointer;background:#263348}button.primary{background:#087ea4}button.danger{background:#66333a}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:var(--muted)}pre{white-space:pre-wrap;max-height:300px;overflow:auto}.hidden{display:none}img{max-width:280px;background:white;padding:12px;border-radius:10px}.status{font-size:24px;font-weight:700}</style>
</head>
<body><main>
  <h1>Bili Notify</h1>
  <section id="login" class="card"><h2>管理员登录</h2><input id="password" type="password" placeholder="管理员密码"><button class="primary" onclick="login()">登录</button><p id="login-error" class="muted"></p></section>
  <div id="console" class="hidden">
    <div class="grid"><section class="card"><h2>服务状态</h2><div id="status" class="status">—</div><pre id="status-detail"></pre></section><section class="card"><h2>B站登录</h2><button onclick="startBiliLogin()">生成登录二维码</button><div id="qr"></div></section></div>
    <section class="card"><h2>UP 主</h2><div class="row"><input id="up-uid" placeholder="UID"><input id="up-name" placeholder="备注名（可空）"><button onclick="addUP()">添加并启用</button></div><div id="ups"></div></section>
    <section class="card"><h2>通知渠道</h2><p class="muted">设置以 JSON 填写。SMTP 邮件：host/port/tls/from/to/username/password；Microsoft Graph：client_id/tenant/to；机器人：webhook/secret。编辑时保留 <code>********</code> 即不修改秘密。</p><div class="row"><input id="channel-name" placeholder="名称"><select id="channel-type" onchange="channelTypeChanged()"><option>email</option><option>microsoft</option><option>dingtalk</option><option>feishu</option><option>wecom</option></select></div><textarea id="channel-settings" rows="5" placeholder='{"host":"smtp.example.com","port":"465","tls":"tls","from":"sender@example.com","to":"receiver@example.com"}'></textarea><div class="row"><button id="channel-save" onclick="saveChannel()">添加并启用</button><button onclick="cancelChannelEdit()">取消编辑</button></div><div id="channels"></div></section>
    <section class="card"><h2>待投递队列</h2><pre id="deliveries"></pre></section>
    <button class="danger" onclick="logout()">退出登录</button>
  </div>
</main><script>
let csrf=sessionStorage.getItem('csrf')||'',currentUPs=[],currentChannels=[],editingChannel='',microsoftLogins={},microsoftLoginTimers={};
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(opt.method&&opt.method!=='GET')opt.headers['X-CSRF-Token']=csrf;const r=await fetch(path,opt);if(r.status===204)return null;const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
async function login(){try{const j=await api('/api/v1/session',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});csrf=j.csrf_token;sessionStorage.setItem('csrf',csrf);showConsole()}catch(e){document.querySelector('#login-error').textContent=e.message}}
async function logout(){await api('/api/v1/session',{method:'DELETE'});sessionStorage.clear();location.reload()}
async function showConsole(){document.querySelector('#login').classList.add('hidden');document.querySelector('#console').classList.remove('hidden');await refresh();setInterval(refresh,5000)}
async function refresh(){try{const [s,u,c,d]=await Promise.all([api('/api/v1/status'),api('/api/v1/ups'),api('/api/v1/channels'),api('/api/v1/deliveries')]);currentUPs=u||[];currentChannels=c||[];document.querySelector('#status').textContent=s.ready?'就绪':'未就绪';document.querySelector('#status-detail').textContent=JSON.stringify(s,null,2);renderUPs();renderChannels();document.querySelector('#deliveries').textContent=JSON.stringify(d,null,2)}catch(e){if(e.message.includes('authentication'))location.reload()}}
function renderUPs(){document.querySelector('#ups').innerHTML=currentUPs.map(u=>`<div class="card"><strong>${escapeHTML(u.name||u.uid)}</strong> <span class="muted">UID ${escapeHTML(u.uid)} · ${u.enabled?'启用':'停用'}</span><div class="row"><button onclick="toggleUP('${u.uid}')">${u.enabled?'停用':'启用'}</button><button class="danger" onclick="deleteUP('${u.uid}')">删除</button></div><small class="muted">${escapeHTML(u.last_error||'')}</small></div>`).join('')||'<p class="muted">尚未添加 UP 主</p>'}
function renderChannels(){document.querySelector('#channels').innerHTML=currentChannels.map(c=>`<div class="card"><strong>${escapeHTML(c.name)}</strong> <span class="muted">${c.type} · ${c.enabled?'启用':'停用'}${c.type==='microsoft'?' · '+(c.settings.authorized==='true'?'已授权':'未授权'):''}</span><pre>${escapeHTML(JSON.stringify(c.settings,null,2))}</pre>${c.type==='microsoft'?`<button onclick="startMicrosoftLogin('${c.id}')">${c.settings.authorized==='true'?'重新授权 Microsoft':'授权 Microsoft'}</button><div class="muted">${microsoftLoginHTML(c.id)}</div>`:''}<div class="row"><button onclick="editChannel('${c.id}')">编辑</button><button onclick="toggleChannel('${c.id}')">${c.enabled?'停用':'启用'}</button><button onclick="testChannel('${c.id}')">测试</button><button class="danger" onclick="deleteChannel('${c.id}')">删除</button></div></div>`).join('')||'<p class="muted">尚未添加通知渠道</p>'}
function microsoftLoginHTML(id){const l=microsoftLogins[id];if(!l)return'';if(l.status==='pending'){const url=l.verification_uri_complete||l.verification_uri;return`<p>打开 <a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">Microsoft 登录页面</a>，输入代码 <strong>${escapeHTML(l.user_code)}</strong></p><p>等待授权…</p>`}const labels={success:'授权完成',failed:'授权失败',expired:'授权已过期',canceled:'授权已取消'};return`<p>${escapeHTML(l.error||labels[l.status]||l.status)}</p>`}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function addUP(){await api('/api/v1/ups',{method:'POST',body:JSON.stringify({uid:document.querySelector('#up-uid').value,name:document.querySelector('#up-name').value,enabled:true})});refresh()}
async function toggleUP(uid){const u=currentUPs.find(x=>x.uid===uid);await api(`/api/v1/ups/${uid}`,{method:'PUT',body:JSON.stringify({...u,enabled:!u.enabled})});refresh()}
async function deleteUP(uid){if(confirm('删除该 UP 及其去重状态？')){await api(`/api/v1/ups/${uid}`,{method:'DELETE'});refresh()}}
async function saveChannel(){let settings;try{settings=JSON.parse(document.querySelector('#channel-settings').value)}catch(e){alert('设置不是合法 JSON');return}const existing=currentChannels.find(x=>x.id===editingChannel),type=document.querySelector('#channel-type').value;const body={...(existing||{}),name:document.querySelector('#channel-name').value,type,enabled:existing?existing.enabled:type!=='microsoft',settings};await api(editingChannel?`/api/v1/channels/${editingChannel}`:'/api/v1/channels',{method:editingChannel?'PUT':'POST',body:JSON.stringify(body)});cancelChannelEdit();refresh()}
function editChannel(id){const c=currentChannels.find(x=>x.id===id);editingChannel=id;document.querySelector('#channel-name').value=c.name;document.querySelector('#channel-type').value=c.type;document.querySelector('#channel-settings').value=JSON.stringify(c.settings,null,2);channelTypeChanged()}
function cancelChannelEdit(){editingChannel='';document.querySelector('#channel-name').value='';document.querySelector('#channel-settings').value='';document.querySelector('#channel-save').textContent='添加并启用';channelTypeChanged()}
function channelTypeChanged(){const type=document.querySelector('#channel-type').value,area=document.querySelector('#channel-settings');area.placeholder=type==='microsoft'?'{"client_id":"Azure 应用程序客户端 ID","tenant":"common","to":"receiver@example.com"}':type==='email'?'{"host":"smtp.example.com","port":"465","tls":"tls","from":"sender@example.com","to":"receiver@example.com"}':'{"webhook":"https://...","secret":"..."}';document.querySelector('#channel-save').textContent=editingChannel?'保存修改':type==='microsoft'?'添加（授权后启用）':'添加并启用'}
async function toggleChannel(id){const c=currentChannels.find(x=>x.id===id);if(c.type==='microsoft'&&!c.enabled&&c.settings.authorized!=='true'){alert('请先完成 Microsoft 授权');return}await api(`/api/v1/channels/${id}`,{method:'PUT',body:JSON.stringify({...c,enabled:!c.enabled})});refresh()}
async function testChannel(id){try{await api(`/api/v1/channels/${id}/test`,{method:'POST'});alert('测试通知已发送')}catch(e){alert(e.message)}}
async function startMicrosoftLogin(id){try{if(microsoftLoginTimers[id])clearInterval(microsoftLoginTimers[id]);const l=await api(`/api/v1/channels/${id}/microsoft/login`,{method:'POST'}),url=l.verification_uri_complete||l.verification_uri;microsoftLogins[id]=l;renderChannels();window.open(url,'_blank','noopener,noreferrer');microsoftLoginTimers[id]=setInterval(async()=>{try{const s=await api(`/api/v1/channels/${id}/microsoft/login`);microsoftLogins[id]=s;renderChannels();if(s.status==='pending')return;clearInterval(microsoftLoginTimers[id]);delete microsoftLoginTimers[id];if(s.status==='success'){alert('Microsoft 授权完成。请启用渠道并发送测试通知。');refresh()}}catch(e){clearInterval(microsoftLoginTimers[id]);delete microsoftLoginTimers[id];microsoftLogins[id]={status:'failed',error:e.message};renderChannels()}},2000)}catch(e){alert(e.message)}}
async function deleteChannel(id){if(confirm('只有不存在待投递任务时才能删除。继续？')){try{await api(`/api/v1/channels/${id}`,{method:'DELETE'});refresh()}catch(e){alert(e.message)}}}
async function startBiliLogin(){try{const l=await api('/api/v1/bilibili/login',{method:'POST'});document.querySelector('#qr').innerHTML=`<p>请使用哔哩哔哩 App 扫码</p><img src="/api/v1/bilibili/login/${encodeURIComponent(l.id)}/qr.png"><p id="qr-status">等待扫码</p>`;const timer=setInterval(async()=>{try{const s=await api(`/api/v1/bilibili/login/${encodeURIComponent(l.id)}`);document.querySelector('#qr-status').textContent=s.status;if(s.status==='success'||s.status==='expired'){clearInterval(timer);refresh()}}catch(e){clearInterval(timer);alert(e.message)}},2000)}catch(e){alert(e.message)}}
if(csrf)showConsole();
</script></body></html>
